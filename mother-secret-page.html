<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MU/TH/UR 6000</title>
<style>
  /* ============================================================
     CRT / MU-TH-UR 6000 terminal  —  ALIEN (1979) inspired
     ============================================================ */

  :root{
    --phosphor:#33ff66;        /* main green phosphor */
    --phosphor-dim:#1f9c40;    /* dimmed text        */
    --amber:#ffb000;           /* warning / alert    */
    --danger:#ff3b30;          /* access denied      */
    --bg:#020402;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;
  }

  /* The physical "monitor" — a slightly bulging dark glass tube */
  .crt{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at center,
        #0a140a 0%,
        #050a05 55%,
        #000 100%);
    overflow:hidden;
  }

  /* Curved screen / vignette + corner darkening for tube glass */
  .crt::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,0) 60%,
      rgba(0,0,0,.55) 100%);
    pointer-events:none;
    z-index:5;
  }

  /* Moving scanlines + fixed raster lines */
  .crt::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,.28) 3px,
        rgba(0,0,0,.28) 4px);
    pointer-events:none;
    z-index:6;
    mix-blend-mode:multiply;
  }

  /* A single bright scanline sweeping down the tube */
  .sweep{
    position:absolute;
    left:0;right:0;
    height:140px;
    background:linear-gradient(
      to bottom,
      rgba(51,255,102,0) 0%,
      rgba(51,255,102,.06) 50%,
      rgba(51,255,102,0) 100%);
    z-index:7;
    pointer-events:none;
    animation:sweep 7s linear infinite;
  }
  @keyframes sweep{
    0%{transform:translateY(-160px)}
    100%{transform:translateY(100vh)}
  }

  /* The text "screen" itself */
  .screen{
    position:absolute;
    inset:0;
    padding:6vh 7vw;
    color:var(--phosphor);
    text-shadow:
      0 0 1px rgba(51,255,102,.9),
      0 0 6px rgba(51,255,102,.55),
      0 0 14px rgba(51,255,102,.30);
    font-size:clamp(13px,1.7vw,20px);
    line-height:1.5;
    letter-spacing:.5px;
    z-index:4;
    overflow:hidden;
    animation:flicker 4s infinite, jitter 6s infinite;
  }

  /* Phosphor flicker + brightness wobble */
  @keyframes flicker{
    0%,100%{opacity:1}
    7%{opacity:.86}
    9%{opacity:1}
    52%{opacity:.94}
    54%{opacity:1}
    78%{opacity:.9}
    80%{opacity:1}
  }
  @keyframes jitter{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(0,.6px)}
  }

  .line{white-space:pre-wrap;word-break:break-word}
  .dim{color:var(--phosphor-dim);text-shadow:0 0 5px rgba(31,156,64,.5)}
  .amber{color:var(--amber);text-shadow:0 0 8px rgba(255,176,0,.6)}
  .danger{color:var(--danger);text-shadow:0 0 10px rgba(255,59,48,.7)}
  .center{text-align:center}
  .big{font-size:clamp(22px,4vw,52px);letter-spacing:6px;font-weight:bold}
  .gap{height:1.2em}

  /* Blinking block cursor */
  .cursor{
    display:inline-block;
    width:.62em;height:1.05em;
    background:var(--phosphor);
    box-shadow:0 0 8px rgba(51,255,102,.8);
    vertical-align:-2px;
    margin-left:2px;
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* Passcode prompt */
  .prompt-wrap{margin-top:1.4em}
  .codeline{display:flex;align-items:center;flex-wrap:wrap;gap:.4ch}
  #code{
    background:transparent;
    border:none;
    outline:none;
    color:var(--phosphor);
    font:inherit;
    font-size:inherit;
    text-shadow:inherit;
    letter-spacing:6px;
    width:9ch;
    caret-color:transparent;
  }
  #code::placeholder{color:var(--phosphor-dim);opacity:.5;letter-spacing:2px}

  .hint{margin-top:1.6em;font-size:.78em;opacity:.55}

  /* ACCESS GRANTED panel */
  .vault{
    margin-top:1.6em;
    border:1px solid rgba(51,255,102,.5);
    box-shadow:0 0 18px rgba(51,255,102,.25) inset,0 0 14px rgba(51,255,102,.18);
    padding:clamp(16px,3vw,34px);
    max-width:760px;
    background:rgba(8,30,12,.35);
  }
  .vault img{
    display:block;
    width:100%;
    max-width:520px;
    margin:1.1em auto;
    border:1px solid rgba(51,255,102,.4);
    filter:saturate(.55) brightness(.92) contrast(1.05);
    image-rendering:auto;
  }
  .btn{
    display:inline-block;
    margin-top:.6em;
    padding:.7em 1.6em;
    color:var(--bg);
    background:var(--phosphor);
    text-decoration:none;
    font-weight:bold;
    letter-spacing:3px;
    text-shadow:none;
    border:none;
    cursor:pointer;
    box-shadow:0 0 18px rgba(51,255,102,.55);
    transition:transform .08s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(51,255,102,.85)}

  .hidden{display:none}

  /* Power-on flash when the tube "warms up" */
  .poweron{
    position:absolute;inset:0;z-index:20;background:#000;pointer-events:none;
  }
  .poweron.go{animation:poweron 1.5s ease-out forwards}
  @keyframes poweron{
    0%{background:#000}
    6%{background:#fff;opacity:1}
    9%{background:#cfffe0}
    14%{transform:scaleY(.004);background:#eafff0;opacity:1}
    30%{transform:scaleY(.004)}
    55%{transform:scaleY(1);background:#0a1f0e;opacity:.9}
    100%{opacity:0;background:#000;pointer-events:none}
  }

  /* Reduced-motion: kill the heavy animation but keep the look */
  @media (prefers-reduced-motion:reduce){
    .screen{animation:none}
    .sweep{display:none}
    .poweron.go{animation:none;opacity:0}
  }
</style>
</head>
<body>

<div class="crt">
  <div class="sweep"></div>

  <div class="screen" id="screen" aria-live="polite"></div>

  <div class="poweron" id="poweron"></div>
</div>

<script>
/* ============================================================
   ⬇⬇⬇  EDIT THESE THREE VALUES  ⬇⬇⬇
   ============================================================ */

// 1) The clearance code visitors must enter (case-insensitive).
const PASSCODE = "937";

// 2) Where "ACQUIRE PRINT" sends them — PASTE YOUR SHOPIFY PRODUCT URL HERE.
const PRODUCT_URL = "https://your-store.myshopify.com/products/your-exclusive-print";

// 3) (Optional) Preview image of the print. Leave "" to show no image.
const PRINT_IMAGE = "";

// (Optional) Vanity label shown on the unlock screen.
const PRINT_TITLE = "CLASSIFIED PRINT — SPECIAL ORDER 937";

/* ============================================================
   ⬆⬆⬆  Nothing below needs editing  ⬆⬆⬆
   ============================================================ */

const screen = document.getElementById("screen");
const poweron = document.getElementById("poweron");

/* --- tiny WebAudio terminal beep (no external files) --- */
let actx = null;
function beep(freq, dur, vol){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = "square";
    o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur + 0.02);
  }catch(e){/* audio optional */}
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function el(html, cls){
  const d = document.createElement("div");
  d.className = "line" + (cls ? " " + cls : "");
  d.innerHTML = html;
  screen.appendChild(d);
  screen.scrollTop = screen.scrollHeight;
  return d;
}

/* type a line out character-by-character */
async function type(text, cls, cps){
  const d = el("", cls);
  cps = cps || 60;
  for(let i=0;i<text.length;i++){
    d.textContent += text[i];
    if(text[i] !== " ") beep(720, 0.012, 0.012);
    await sleep(1000/cps);
  }
  return d;
}

/* The MU/TH/UR 6000 boot sequence */
const BOOT = [
  ["", "gap"],
  ["WEYLAND-YUTANI CORP", "center big amber"],
  ["", "gap"],
  ["INTERFACE 2037  READY FOR INQUIRY", "center dim"],
  ["", "gap"],
  ["MU/TH/UR 6000  v2.1  —  COLD START", null],
  ["  CPU . . . . . . . . . . . . . . . . . OK", "dim"],
  ["  CORE MEMORY 0640K . . . . . . . . . . OK", "dim"],
  ["  CRYO SUBSYSTEM . . . . . . . . . . .  OK", "dim"],
  ["  NAV ARRAY / DEEP SPACE LINK  . . . .  OK", "dim"],
  ["  SCIENCE OFFICER NODE . . . . . . . . LOCKED", "amber"],
  ["  PRINT VAULT / SPECIAL ORDER . . . . . SEALED", "amber"],
  ["", "gap"],
  ["ESTABLISHING SECURE CHANNEL", null],
  ["TRACE . . . . . . . . . . . . . . . . . COMPLETE", "dim"],
  ["", "gap"],
  ["RESTRICTED ARCHIVE DETECTED.", null],
  ["ONE (1) EXCLUSIVE PRINT HELD UNDER SEAL.", null],
  ["CREW CLEARANCE REQUIRED FOR RELEASE.", "amber"],
  ["", "gap"],
];

let attempts = 0;

async function boot(){
  // power-on flash
  poweron.classList.add("go");
  beep(110, 0.25, 0.05);
  await sleep(900);

  for(const [txt, cls] of BOOT){
    if(txt === ""){ el("&nbsp;", cls); await sleep(120); continue; }
    if(cls && cls.includes("dim")){
      el(txt, cls);                 // status lines snap in fast
      await sleep(160);
    } else {
      await type(txt, cls, txt.length > 26 ? 75 : 45);
      await sleep(180);
    }
  }
  promptCode();
}

function promptCode(){
  const wrap = document.createElement("div");
  wrap.className = "line prompt-wrap";
  wrap.innerHTML =
    '<div class="codeline">' +
      '<span>MU/TH/UR: ENTER CLEARANCE CODE &gt;</span>' +
      '<input id="code" maxlength="16" autocomplete="off" ' +
        'autocapitalize="off" spellcheck="false" placeholder="······" ' +
        'aria-label="Clearance code" />' +
      '<span class="cursor"></span>' +
    '</div>' +
    '<div class="hint">[ Enter your crew clearance code and press RETURN ]</div>';
  screen.appendChild(wrap);

  const input = document.getElementById("code");
  input.focus();
  // keep focus on the field (it IS the terminal)
  document.addEventListener("click", () => input && input.focus());
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); submit(input.value.trim()); }
    else { beep(680, 0.01, 0.012); }
  });
}

async function submit(value){
  const input = document.getElementById("code");
  if(input) input.disabled = true;

  el("&nbsp;", "gap");
  await type("VERIFYING CLEARANCE", null, 45);
  for(let i=0;i<4;i++){ await sleep(260); screen.lastChild.textContent += " ."; }
  await sleep(450);

  if(value.toLowerCase() === PASSCODE.toLowerCase()){
    granted();
  } else {
    attempts++;
    denied();
  }
}

async function granted(){
  beep(880, 0.09, 0.05); await sleep(90); beep(1320, 0.16, 0.05);
  el("&nbsp;", "gap");
  await type("CLEARANCE CONFIRMED.", null, 55);
  await type("DECRYPTING ARCHIVE . . . . . . . . . . DONE", "dim", 90);
  await type("VAULT SEAL RELEASED.", null, 55);
  el("&nbsp;", "gap");
  el("*** ACCESS GRANTED ***", "center big");
  el("&nbsp;", "gap");

  const vault = document.createElement("div");
  vault.className = "line vault center";
  let html = '<div class="amber" style="letter-spacing:3px">' + escapeHtml(PRINT_TITLE) + '</div>';
  if(PRINT_IMAGE){
    html += '<img src="' + encodeURI(PRINT_IMAGE) + '" alt="Exclusive print" />';
  }
  html += '<div class="dim" style="margin:1em 0">' +
          'This item is released to cleared personnel only.<br>' +
          'Distribution strictly limited.</div>';
  html += '<a class="btn" href="' + encodeURI(PRODUCT_URL) + '">ACQUIRE PRINT &gt;</a>';
  vault.innerHTML = html;
  screen.appendChild(vault);
  screen.scrollTop = screen.scrollHeight;
}

async function denied(){
  beep(160, 0.4, 0.06);
  el("&nbsp;", "gap");
  el("*** ACCESS DENIED ***", "center big danger");
  el("CLEARANCE CODE REJECTED — ATTEMPT " + attempts + " LOGGED.", "center danger");
  el("&nbsp;", "gap");

  if(attempts >= 3){
    el("MU/TH/UR: UNAUTHORISED ACCESS. CHANNEL TERMINATED.", "center amber");
    await sleep(1600);
    // collapse the tube like a switched-off CRT
    poweron.style.background = "#000";
    poweron.style.opacity = "1";
    poweron.style.transition = "transform .5s ease-in, opacity .6s ease-in .3s";
    poweron.style.transform = "scaleY(.003)";
    poweron.style.zIndex = "30";
    return;
  }

  el("REENTER CLEARANCE CODE.", "center dim");
  el("&nbsp;", "gap");
  promptCode();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

boot();
</script>
</body>
</html>
